name: release

# Triggers on every pushed tag
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  # Build on Linux because it's faster and .NET is cross-platform
  release-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: dotnet restore

      - name: Build DLL
        run: dotnet build --configuration Release --no-restore

      - name: Prepare mod folder
        run: |
          mkdir mod
          cp TeammateRevive/bin/Release/TeammateRevive.dll mod/
          # the mod loads its text from Localization/ next to the DLL
          cp -r TeammateRevive/bin/Release/Localization mod/
          cp README.md mod/
          cp CHANGELOG.md mod/
          cp manifest.json mod/
          cp readme/icon.png mod/

      - name: Package mod as a zip
        run: cd mod && zip -r ../mod.zip .

      - name: Upload mod package to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="TeammateRevive-$TAG.zip"
          mv mod.zip "$asset"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --title "$TAG" --generate-notes
          fi
